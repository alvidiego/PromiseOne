<section class="contact-form-module" aria-labelledby="contact-form-title-es">
    <div class="contact-form-heading">
        <p class="eyebrow">Consulta de proyecto</p>
        <h2 id="contact-form-title-es">Pedir una Estimacion Gratis</h2>
        <p>Cuentenos sobre su proyecto y la mejor manera de contactarlo.</p>
    </div>

    <form class="contact-form" action="[[MODULE_SETTING_ENDPOINT]]" method="post" accept-charset="UTF-8">
        <div class="contact-form-fields">
            <div class="contact-form-field">
                <label for="contact-name-es">Nombre</label>
                <input id="contact-name-es" name="name" type="text" autocomplete="name" required />
            </div>

            <div class="contact-form-field">
                <label for="contact-email-es">Correo electronico</label>
                <input id="contact-email-es" name="email" type="email" autocomplete="email" required />
            </div>

            <div class="contact-form-field contact-form-field-wide">
                <label for="contact-phone-es">Telefono</label>
                <input id="contact-phone-es" name="phone" type="tel" autocomplete="tel" />
            </div>

            <div class="contact-form-field contact-form-field-wide">
                <label for="contact-message-es">Detalles del proyecto</label>
                <textarea id="contact-message-es" name="message" rows="6" required></textarea>
            </div>
        </div>

        <button class="contact-form-submit" type="submit">Enviar Solicitud</button>
    </form>
</section>
