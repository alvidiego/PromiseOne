<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Drop | GXE</title>
    <meta name="description" content="Make every release feel like an arrival, not another listing." />
    
<link rel="icon" href="assets/gxe-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/style.css" />
    
</head>
<body>
    <a class="gxe-skip-link" href="#main-content">Skip to content</a>
        <section class="gxe-experience gxe-intro-overlay" data-stage="arrival" data-intro-delay="1000" data-gxe-intro aria-label="GXE introduction">
        <p class="gxe-visually-hidden">GXE chrome emblem introduction</p>
        <div class="gxe-arrival-scene" aria-hidden="true">
            <div class="gxe-emblem">
                <span class="gxe-word">
                    <img class="gxe-reference gxe-reference-chrome" src="assets/gxe-reference.jpg" alt="" />
                    <img class="gxe-reference gxe-reference-full" src="assets/gxe-reference.jpg" alt="" />
                </span>
                <span class="gxe-stones" aria-hidden="true">
                    <span class="gxe-stone gxe-stone-01"></span><span class="gxe-stone gxe-stone-02"></span>
                    <span class="gxe-stone gxe-stone-03"></span><span class="gxe-stone gxe-stone-04"></span>
                    <span class="gxe-stone gxe-stone-05"></span><span class="gxe-stone gxe-stone-06"></span>
                    <span class="gxe-stone gxe-stone-07"></span><span class="gxe-stone gxe-stone-08"></span>
                    <span class="gxe-stone gxe-stone-09"></span><span class="gxe-stone gxe-stone-10"></span>
                    <span class="gxe-stone gxe-stone-11"></span><span class="gxe-stone gxe-stone-12"></span>
                </span>
            </div>
        </div>
        <div class="gxe-bloom" aria-hidden="true"></div>
        <button class="gxe-intro-skip" type="button" data-gxe-intro-skip>Skip intro</button>
    </section>

    <div id="hub" class="gxe-home-shell gxe-cosmic-hub" data-gxe-home-hub>
        <header class="gxe-cosmic-header">
            <a href="#main-content" aria-label="GXE Home">GXE</a>
        </header>
        <main id="main-content" class="gxe-cosmic-main">
            <h1 class="gxe-visually-hidden">GXE home hub</h1>
            <section class="gxe-cosmic-stage" aria-label="Choose a GXE destination">
                <nav class="gxe-cosmic-menu" aria-label="GXE destinations">
                    <p class="gxe-cosmic-menu-label"><span>Main</span> <span>Menu</span></p>
                    <a class="gxe-cosmic-route gxe-cosmic-route--primary" href="the_piece.en.html#film">
                        <span class="gxe-cosmic-route-index">01</span>
                        <span><strong>Drop 001</strong><small>The Piece / film / garment</small></span>
                        <b aria-hidden="true">↗</b>
                    </a>
                    <div class="gxe-cosmic-secondary-routes">
                        <a class="gxe-cosmic-route gxe-cosmic-route--family" href="exposure.en.html">
                            <span class="gxe-cosmic-route-index">02</span>
                            <span><strong>GXE Family</strong><small>People / fits / outside</small></span>
                            <b aria-hidden="true">↗</b>
                        </a>
                        <a class="gxe-cosmic-route gxe-cosmic-route--contact" href="contact.en.html">
                            <span class="gxe-cosmic-route-index">03</span>
                            <span><strong>Tap In</strong><small>Call or text to purchase</small></span>
                            <b aria-hidden="true">↗</b>
                        </a>
                    </div>
                </nav>
                <div class="gxe-cosmic-portal" aria-hidden="true">
                    <div class="gxe-cosmic-portal-field"></div>
                    <div class="gxe-cosmic-portal-ring"></div>
                    <img src="assets/gxe-reference.jpg" alt="" />
                </div>
            </section>
        </main>
        <button class="gxe-cosmic-replay" type="button" data-gxe-intro-replay>Replay intro ↻</button>
    </div>
    <script src="assets/experience.js"></script>
    <script type="module" src="assets/creative/creative-motion.js"></script>
</body>
</html>
